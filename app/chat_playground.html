<script>

const chatLog=document.getElementById("chatLog"),emptyState=document.getElementById("emptyState"),messageInput=document.getElementById("messageInput"),sendBtn=document.getElementById("sendBtn"),statusText=document.getElementById("statusText"),customerIdChip=document.getElementById("customerIdChip"),previewDrawer=document.getElementById("previewDrawer"),previewDrawerBackdrop=document.getElementById("previewDrawerBackdrop"),previewDrawerName=document.getElementById("previewDrawerName"),previewDrawerFrame=document.getElementById("previewDrawerFrame"),previewDrawerDownloadBtn=document.getElementById("previewDrawerDownloadBtn"),previewDrawerCloseBtn=document.getElementById("previewDrawerCloseBtn");
let isSending=false,pendingAssistantEntry=null,artifactSequence=0,activePreviewArtifact=null,scrollFrame=0,chatAutoStick=true;const messageEntries=[];customerIdChip.textContent=customerId;
const EXEC_NOISE_PATTERNS=[/^OpenAI Codex v/i,/^--------$/,/^workdir:/i,/^model:/i,/^provider:/i,/^approval:/i,/^sandbox:/i,/^reasoning effort:/i,/^reasoning summaries:/i,/^session id:/i,/^tokens used$/i,/^user$/i,/^codex$/i,/^\d{1,3}(,\d{3})*$/];

function ensureExecLog(entry){if(entry.execRoot)return entry.execRoot;const root=document.createElement("div");root.className="message-exec hidden";const label=document.createElement("span");label.className="message-exec-label";label.textContent="\u8fdb\u7a0b";const output=document.createElement("div");output.className="message-exec-output empty";output.textContent="\u8bf7\u6c42\u5df2\u63d0\u4ea4\uff0c\u6b63\u5728\u521d\u59cb\u5316\u3002";root.append(label,output);entry.body.appendChild(root);entry.execRoot=root;entry.execHint=label;entry.execOutput=output;entry.execLastPhase="";entry.execLastSemantic="";return root}

function shouldIgnoreExecLine(entry,line){const trimmed=String(line||"").trim();if(!trimmed)return true;if(entry&&entry.requestText&&trimmed===entry.requestText.trim())return true;return EXEC_NOISE_PATTERNS.some((pattern)=>pattern.test(trimmed))}
function translateExecLine(entry,kind,line){const trimmed=String(line||"").trim();if(shouldIgnoreExecLine(entry,trimmed))return null;if(kind==="stdout")return {kind:"log",text:`\u52a9\u624b\u8f93\u51fa\u6b63\u6587\uff1a${trimmed}`};if(kind==="stderr"){if(entry&&entry.requestText&&trimmed===entry.requestText.trim())return null;if(/^tool\b/i.test(trimmed))return {kind:"log",text:`\u5de5\u5177\u4e8b\u4ef6\uff1a${trimmed}`};if(/^(reading|searching|analyzing|updating|editing|running|checking)\b/i.test(trimmed))return {kind:"log",text:`\u7a0b\u5e8f\u64cd\u4f5c\uff1a${trimmed}`};return {kind:"log",text:trimmed}}return {kind:"log",text:trimmed}}
function appendExecLog(entry,kind,text){if(!entry)return;ensureExecLog(entry);if(kind==="phase"){setExecPhase(entry,String(text||"").trim());return}if(kind==="ping")return;const normalized=String(text||"").replace(/\r/g,"").trim();if(!normalized)return;const lines=normalized.split("\n").map((line)=>line.trim()).filter(Boolean);if(!lines.length)return;let latestText="";for(const line of lines){const translated=translateExecLine(entry,kind,line);if(!translated)continue;if(translated.kind==="phase"){setExecPhase(entry,translated.text);latestText="";continue}if(translated.text===entry.execLastSemantic)continue;entry.execLastSemantic=translated.text;latestText=`${nowLabel()} ${translated.text}`}if(!latestText)return;entry.execOutput.textContent=latestText;entry.execOutput.classList.remove("empty");entry.execRoot.classList.remove("hidden")}
function escapeHtml(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}function renderInlineMarkdown(text){return escapeHtml(text).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/`([^`\n]+)`/g,"<code>$1</code>")}
function appendMarkdownBlocks(container,text){const normalized=text.replace(/\r/g,"");const blocks=normalized.split(/\n{2,}/).filter((block)=>block.trim());blocks.forEach((block)=>{const trimmed=block.trim(),lines=block.split("\n").filter((line)=>line.trim()!=="");if(!lines.length)return;const heading=trimmed.match(/^(#{1,6})\s+(.+)$/);if(heading){const element=document.createElement(`h${heading[1].length}`);element.innerHTML=renderInlineMarkdown(heading[2].trim());container.appendChild(element);return}if(lines.every((line)=>/^\s*>\s?/.test(line))){const quote=document.createElement("blockquote");quote.innerHTML=lines.map((line)=>renderInlineMarkdown(line.replace(/^\s*>\s?/,""))).join("<br />");container.appendChild(quote);return}if(lines.every((line)=>/^\s*[-*]\s+/.test(line))){const list=document.createElement("ul");lines.forEach((line)=>{const item=document.createElement("li");item.innerHTML=renderInlineMarkdown(line.replace(/^\s*[-*]\s+/,""));list.appendChild(item)});container.appendChild(list);return}if(lines.every((line)=>/^\s*\d+\.\s+/.test(line))){const list=document.createElement("ol");lines.forEach((line)=>{const item=document.createElement("li");item.innerHTML=renderInlineMarkdown(line.replace(/^\s*\d+\.\s+/,""));list.appendChild(item)});container.appendChild(list);return}const paragraph=document.createElement("p");paragraph.innerHTML=lines.map((line)=>renderInlineMarkdown(line)).join("<br />");container.appendChild(paragraph)})}

function isHtmlDocument(text){return /<!doctype html|<html[\s>]|<body[\s>]|<head[\s>]/i.test(text)}function normalizeHtmlArtifact(text){return String(text||"").replace(/\r/g,"").trim()}function buildArtifactFileName(){artifactSequence+=1;const stamp=new Date().toISOString().replace(/[:.]/g,"-");return `${customerId}-html-${String(artifactSequence).padStart(3,"0")}-${stamp}.html`}
function extractHtmlArtifacts(reply){const normalizedReply=String(reply||"").replace(/\r/g,"");const artifacts=[];if(!/```html|<!doctype html|<html[\s>]/i.test(normalizedReply))return artifacts;const seen=new Set(),fencePattern=/```([a-zA-Z0-9_-]*)[ \t]*\n([\s\S]*?)```/g;let match=null;while((match=fencePattern.exec(normalizedReply))!==null){const lang=(match[1]||"").toLowerCase(),html=normalizeHtmlArtifact(match[2]||"");if(!html||!(lang==="html"||isHtmlDocument(html))||seen.has(html))continue;seen.add(html);artifacts.push({html,fileName:buildArtifactFileName()})}if(!artifacts.length){const documentPattern=/<!doctype html[\s\S]*?<\/html>|<html[\s\S]*?<\/html>/ig;while((match=documentPattern.exec(normalizedReply))!==null){const html=normalizeHtmlArtifact(match[0]);if(!html||seen.has(html))continue;seen.add(html);artifacts.push({html,fileName:buildArtifactFileName()})}}return artifacts}

function createArtifactCard(artifact,index){const card=document.createElement("section");card.className="artifact-card";const header=document.createElement("div");header.className="artifact-card-header";const title=document.createElement("div");title.className="artifact-card-title";title.innerHTML=`<strong>HTML \u4ea7\u7269 ${index+1}</strong><span>${artifact.fileName}</span>`;header.appendChild(title);const actions=document.createElement("div");actions.className="artifact-actions";const previewButton=document.createElement("button");previewButton.type="button";previewButton.className="btn";previewButton.textContent="\u6253\u5f00\u9884\u89c8";previewButton.addEventListener("click",()=>openPreviewDrawer(artifact));const downloadButton=document.createElement("button");downloadButton.type="button";downloadButton.className="btn ghost";downloadButton.textContent="\u4e0b\u8f7d HTML";downloadButton.addEventListener("click",()=>downloadHtml(artifact.html,artifact.fileName));actions.append(previewButton,downloadButton);card.append(header,actions);return card}
function renderArtifactCards(container,artifacts){container.innerHTML="";if(!artifacts.length){container.classList.add("hidden");return}const fragment=document.createDocumentFragment();container.classList.remove("hidden");artifacts.forEach((artifact,index)=>fragment.appendChild(createArtifactCard(artifact,index)));container.appendChild(fragment)}function buildPendingMessage(){return""}function renderPendingProgress(){if(!pendingAssistantEntry)return;renderMessageContent(pendingAssistantEntry,"")}function parseReplySegments(reply){const normalized=String(reply||"").replace(/\r/g,"");const segments=[];const fencePattern=/```([a-zA-Z0-9_-]*)[ \t]*\n([\s\S]*?)```/g;let lastIndex=0,match=null;while((match=fencePattern.exec(normalized))!==null){if(match.index>lastIndex)segments.push({type:"prose",text:normalized.slice(lastIndex,match.index)});segments.push({type:"code",language:(match[1]||"text").toLowerCase(),content:match[2]||""});lastIndex=match.index+match[0].length}if(lastIndex<normalized.length)segments.push({type:"prose",text:normalized.slice(lastIndex)});if(!segments.length)segments.push({type:"prose",text:normalized});return segments.filter((segment)=>segment.type==="code"||segment.text.length>0)}

function startTypewriter(entry,reply){if(!entry)return;cancelTypewriter(entry,false);const finalReply=String(reply||""),segments=parseReplySegments(finalReply);entry.rawText=finalReply;entry.finalReply=finalReply;entry.pendingArtifacts=extractHtmlArtifacts(finalReply);entry.isTyping=true;entry.markdown.innerHTML="";entry.artifacts.innerHTML="";entry.artifacts.classList.add("hidden");const controller={cancelled:false,frameId:0,segments,segmentIndex:0,proseIndex:0,proseContainer:null};entry.typingController=controller;const schedule=()=>{controller.frameId=window.requestAnimationFrame(step)};const step=()=>{if(controller.cancelled||entry.typingController!==controller)return;while(controller.segmentIndex<controller.segments.length){const segment=controller.segments[controller.segmentIndex];if(segment.type==="code"){if(controller.proseContainer){controller.proseContainer.classList.remove("is-typing");controller.proseContainer=null}entry.markdown.appendChild(createCodeBlock(segment.language,segment.content));controller.segmentIndex+=1;scrollChatToBottom();continue}if(!controller.proseContainer){controller.proseContainer=document.createElement("div");controller.proseContainer.className="typing-segment is-typing";entry.markdown.appendChild(controller.proseContainer)}const stepSize=segment.text.length>480?8:4,nextIndex=Math.min(segment.text.length,controller.proseIndex+stepSize);renderMarkdown(controller.proseContainer,segment.text.slice(0,nextIndex));controller.proseIndex=nextIndex;scrollChatToBottom();if(controller.proseIndex<segment.text.length){schedule();return}controller.proseContainer.classList.remove("is-typing");controller.proseContainer=null;controller.proseIndex=0;controller.segmentIndex+=1}flushTypewriter(entry)};schedule()}

function buildPayload(message){return{message,cwd:DEFAULT_CWD,continue_context:true,session_id:customerId}}function splitBuffer(buffer){const lines=[];let rest=buffer;while(true){const index=rest.indexOf("\n");if(index===-1)return{lines,rest};lines.push(rest.slice(0,index));rest=rest.slice(index+1)}}
