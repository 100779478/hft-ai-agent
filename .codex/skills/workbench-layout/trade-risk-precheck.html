function rowsHtml(v,t,rows){const k=key(v,t);if(!rows.length)return `<tr><td colspan="10" style="height:140px;color:rgba(255,255,255,.52)">${S.noRows}${({contract:S.contract,variety:S.variety,exchange:S.exchange})[t]}${S.riskItem}</td></tr>`;return rows.map(r=>`<tr class="${sel[k]===r.id?"sel":""} ${r.sub?"sub":""}" data-id="${r.id}" data-t="${t}"><td>${ck(sel[k]===r.id)}</td><td class="l">${r.sub?"":r.entity}</td><td class="w">${r.sub?'<div class="riskcell"><button class="xp off">\u25b6</button><span></span></div>':`<div class="riskcell"><button class="xp ${r.long?"":"off"}" data-x="${r.id}">${exp.has(r.id)?"\u25bc":"\u25b6"}</button><span>${r.item}</span></div>`}</td><td>${r.w1}</td><td>${ck(r.c1)}</td><td>${r.w2}</td><td>${ck(r.c2)}</td><td>${r.w3}</td><td>${ck(r.c3)}</td><td>${tg(r.time,r.time===S.day?"day":"long")}</td></tr>`).join("")}
function sec(v,t){const map={contract:S.contract,variety:S.variety,exchange:S.exchange};const title={contract:S.contractRisk,variety:S.varietyRisk,exchange:S.exchangeRisk};const id=`q-${v}-${t}`;const q=document.getElementById(id)?.value.trim().toLowerCase()||"";const rows=visible(src(v)[t]).filter(r=>!q||`${r.entity} ${r.item} ${r.time}`.toLowerCase().includes(q));if(!sel[key(v,t)]&&src(v)[t].length)sel[key(v,t)]=src(v)[t][0].id;const st=`<div class="state ${state==="empty"?"active":""}"><div class="box"><div>${S.empty}</div><div>${S.emptyText}</div></div></div><div class="state ${state==="loading"?"active":""}"><div class="box"><div class="dots"><span></span><span></span><span></span></div><div>${S.loadingText}</div></div></div><div class="state ${state==="error"?"active":""}"><div class="box"><div>${S.error}</div><div>${S.errorText}</div></div></div>`;return `<section class="sec"><div class="shd"><div class="st"><button class="cp open" aria-label="\u6536\u8d77"></button>${title[t]}</div></div><div class="body"><div class="tools"><div class="actions"><button class="ibtn add" data-v="${v}" data-t="${t}">+</button><button class="ibtn del" data-v="${v}" data-t="${t}">-</button></div><div class="search"><input class="input q" id="${id}" placeholder="${S.search}${map[t]}"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="#4e6aa0" stroke-width="1.5"></circle><path d="M10.5 10.5L14 14" stroke="#4e6aa0" stroke-width="1.5" stroke-linecap="round"></path></svg></div></div><div class="grid ${state==="normal"?"":"hide"}"><div class="tbl"><table><colgroup><col style="width:40px"><col style="width:120px"><col style="width:240px"><col style="width:110px"><col style="width:86px"><col style="width:128px"><col style="width:116px"><col style="width:96px"><col style="width:86px"><col style="width:96px"></colgroup><thead><tr><th><input class="ck" type="checkbox"></th><th>${map[t]}</th><th>${S.riskItem}</th><th>${S.warnValue}</th><th>${S.warn}</th><th>${S.confirmValue}</th><th>${S.confirm}</th><th>${S.interceptValue}</th><th>${S.intercept}</th><th>${S.time}</th></tr></thead><tbody>${rowsHtml(v,t,rows)}</tbody></table></div></div>${st}</div></section>`}
function render(v){const host=v==="global"?"#secs-global":"#secs-book";$(host).innerHTML=["contract","variety","exchange"].map(t=>sec(v,t)).join("");$$(`${host} .cp`).forEach(x=>x.onclick=()=>{const s=x.closest(".sec");s.classList.toggle("hide");const c=s.classList.contains("hide");x.classList.toggle("closed",c);x.classList.toggle("open",!c);x.setAttribute("aria-label",c?"\u5c55\u5f00":"\u6536\u8d77")});$$(`${host} .q`).forEach(x=>x.oninput=()=>render(v));$$(`${host} .add`).forEach(x=>x.onclick=()=>openDlg(x.dataset.v,x.dataset.t));$$(`${host} .del`).forEach(x=>x.onclick=()=>{const t=x.dataset.t,k=key(v,t),id=sel[k],rows=src(v)[t],cur=rows.find(r=>r.id===id);if(!cur)return;src(v)[t]=rows.filter(r=>r.id!==id&&r.id!==cur.long);sel[k]=src(v)[t][0]?.id||null;render(v)});$$(`${host} .xp`).forEach(x=>x.onclick=e=>{e.stopPropagation();const id=x.dataset.x;if(!id)return;exp.has(id)?exp.delete(id):exp.add(id);render(v)});$$(`${host} tbody tr[data-id]`).forEach(x=>x.onclick=()=>{sel[key(v,x.dataset.t)]=x.dataset.id;render(v)})}
function renderBooks(){$("#books").innerHTML=B.map(x=>`<button class="booki ${x.id===bookId?"active":""}" data-id="${x.id}"><div>${x.name}</div></button>`).join("");$$(".booki").forEach(x=>x.onclick=()=>{bookId=x.dataset.id;renderBooks();render("book")})}
function desc(){const x=R.find(a=>a[0]===$("#risk").value);$("#desc").textContent=x?x[1]:""}
function openDlg(v,t){ctx={v,t};const map={contract:S.contract,variety:S.variety,exchange:S.exchange};document.getElementById("dt").textContent=map[t]+S.dlg;document.getElementById("el").textContent=map[t];document.getElementById("entity").value="";["w1","w2","w3"].forEach(id=>document.getElementById(id).value="");["c1","c2","c3"].forEach(id=>document.getElementById(id).checked=true);document.getElementById("tm").value=S.long;document.getElementById("opts").innerHTML=O[t].map(x=>`<option value="${x}"></option>`).join("");document.getElementById("mask").classList.add("open")}
function closeDlg(){document.getElementById("mask").classList.remove("open");ctx=null}
document.title=S.t;
document.getElementById("app").innerHTML=`<div class="app"><div class="title"><div class="left"><div class="mark"></div><div class="name">${S.t}</div></div><div class="right"><div class="pill">- x</div></div></div><div class="tabs"><button class="tab active" data-v="global">${S.g}</button><button class="tab" data-v="book">${S.b}</button></div><div class="bar"></div><div class="wrap"><div class="view global active" id="view-global"><div class="main"><div class="secs" id="secs-global"></div></div></div><div class="view book" id="view-book"><div class="side"><div class="hd"><div>${S.books}</div></div><div class="list" id="books"></div></div><div class="main"><div class="secs" id="secs-book"></div></div></div></div></div><div class="mask" id="mask"><div class="dlg"><div class="dh"><div id="dt">${S.contract}${S.dlg}</div><button class="dc" id="close">x</button></div><div class="db"><div class="form"><label class="lab" id="el" for="entity">${S.contract}</label><input class="input" id="entity" list="opts"><div></div><label class="lab" for="risk">${S.riskItem}</label><select class="sel" id="risk"></select><div></div><label class="lab" for="w1">${S.warnValue}</label><input class="input" id="w1"><label><input id="c1" class="ck" type="checkbox"> ${S.warn}</label><label class="lab" for="w2">${S.confirmValue}</label><input class="input" id="w2"><label><input id="c2" class="ck" type="checkbox"> ${S.confirm}</label><label class="lab" for="w3">${S.interceptValue}</label><input class="input" id="w3"><label><input id="c3" class="ck" type="checkbox"> ${S.intercept}</label><label class="lab" for="tm">${S.time}</label><select class="sel" id="tm"><option>${S.long}</option><option>${S.day}</option></select><div></div><div></div><div class="desc span2" id="desc"></div></div></div><div class="df"><div class="foot"><button class="btn ghost" id="cancel">${S.cancel}</button><button class="btn pri" id="ok">${S.ok}</button></div></div><datalist id="opts"></datalist></div></div>`;
R.forEach(x=>document.getElementById("risk").insertAdjacentHTML("beforeend",`<option>${x[0]}</option>`));document.getElementById("risk").onchange=desc;desc();
document.getElementById("close").onclick=closeDlg;document.getElementById("cancel").onclick=closeDlg;document.getElementById("mask").onclick=e=>{if(e.target.id==="mask")closeDlg()};
document.getElementById("ok").onclick=()=>{if(!ctx)return;const entity=document.getElementById("entity").value.trim();if(!entity){document.getElementById("entity").focus();return}src(ctx.v)[ctx.t].unshift({id:Date.now()+"",entity,item:document.getElementById("risk").value,w1:document.getElementById("w1").value.trim(),c1:+document.getElementById("c1").checked,w2:document.getElementById("w2").value.trim(),c2:+document.getElementById("c2").checked,w3:document.getElementById("w3").value.trim(),c3:+document.getElementById("c3").checked,time:document.getElementById("tm").value});sel[key(ctx.v,ctx.t)]=src(ctx.v)[ctx.t][0].id;render(ctx.v);closeDlg()};
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===x));view=x.dataset.v;document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById("view-"+view).classList.add("active")});
renderBooks();render("global");render("book");
</script>
</body>
</html>
